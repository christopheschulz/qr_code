<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanned Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            border-bottom: 2px solid #ddd;
        }
        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        h1 {
            margin: 20px 0;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            text-align: left;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background: #f5f5f5;
            padding: 10px;
        }
        .items {
            padding: 10px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .footer {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-top: 2px solid #ddd;
        }
        button {
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Scanner QR Code</a>
        <a href="#">Lecteur QR code</a>
        <a href="#">Générateur QR Code</a>
        <a href="#">Historique</a>
        <a href="#">À propos</a>
    </nav>
    <h1>Scanned Items</h1>
    <div class="container">
        <div class="header">
            <span>SCANNED ITEMS(1)</span>
            <div>
                <button>Télécharger tout</button>
                <button>Effacer tout</button>
            </div>
        </div>
        <div class="items">
            <div class="item">
                <span>1</span>
                <a href="https://translate.google.fr/?hl=fr&sl=auto&tl=fr&op=translate">URL: Google Translate</a>
                <button>❌</button>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; QRScanner.net - Tous droits réservés.</p>
    </div>
</body>
</html>
