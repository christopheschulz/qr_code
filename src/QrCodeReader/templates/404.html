{% extends 'base.html' %}

{% block title %}<title>Page non trouvée - QR Code by Kriss</title>{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto text-center py-16">
    <!-- Illustration SVG - QR code cassé -->
    <div class="mb-8 inline-block">
        <svg class="w-40 h-40 mx-auto text-gray-200" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- QR code pattern (grille partielle) -->
            <rect x="20" y="20" width="40" height="40" rx="4" stroke="currentColor" stroke-width="3" fill="none"/>
            <rect x="28" y="28" width="24" height="24" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="100" y="20" width="40" height="40" rx="4" stroke="currentColor" stroke-width="3" fill="none"/>
            <rect x="108" y="28" width="24" height="24" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="20" y="100" width="40" height="40" rx="4" stroke="currentColor" stroke-width="3" fill="none"/>
            <rect x="28" y="108" width="24" height="24" rx="2" fill="currentColor" opacity="0.3"/>
            <!-- Éléments manquants (pointillés) -->
            <rect x="100" y="100" width="40" height="40" rx="4" stroke="currentColor" stroke-width="3" stroke-dasharray="6 4" fill="none" opacity="0.4"/>
            <!-- Petits carrés de données -->
            <rect x="68" y="20" width="12" height="12" rx="2" fill="currentColor" opacity="0.15"/>
            <rect x="68" y="40" width="12" height="12" rx="2" fill="currentColor" opacity="0.15"/>
            <rect x="20" y="68" width="12" height="12" rx="2" fill="currentColor" opacity="0.15"/>
            <rect x="40" y="68" width="12" height="12" rx="2" fill="currentColor" opacity="0.15"/>
            <!-- Point d'interrogation au centre -->
            <text x="80" y="88" text-anchor="middle" font-size="28" font-weight="bold" fill="currentColor" opacity="0.5">?</text>
        </svg>
    </div>

    <h1 class="text-7xl font-bold text-gray-200 mb-2">404</h1>
    <h2 class="text-2xl font-semibold text-gray-900 mb-3">Page non trouvée</h2>
    <p class="text-gray-500 mb-8 max-w-md mx-auto">
        La page que vous recherchez n'existe pas ou a été déplacée. Vérifiez l'URL ou retournez à l'accueil.
    </p>
    <div class="flex items-center justify-center gap-4">
        <a href="{% url 'generate_qr_code_view' %}" class="inline-flex items-center px-6 py-3 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 transition-colors duration-200 shadow-sm">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
            Retour à l'accueil
        </a>
    </div>
</div>
{% endblock %}
