{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block title %}{% endblock %}
    <title>Générateur de QR Code</title>
</head>

<body class="bg-gray-100 text-gray-900">
    <!-- Navigation principale -->
    <nav class="bg-white shadow-md py-4 px-6 flex justify-center space-x-6">
        <a href="{% url 'index' %}" class="nav-link font-semibold py-2 px-4 rounded-lg">Générateur QR Code</a>
        <a href="{% url 'qrreader' %}" class="nav-link font-semibold py-2 px-4 rounded-lg">Lecteur QR Code</a>
        <a href="{% url 'about' %}" class="nav-link font-semibold py-2 px-4 rounded-lg">À propos</a>
    </nav>

    <!-- Contenu principal -->
    <main class="container mx-auto py-10 px-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow-md py-6 mt-10">
        <div class="container mx-auto text-center">
            <p class="text-gray-600 text-sm">&copy; 2025 
                <a href="https://qrcodebykriss.fr" class="font-semibold hover:underline">qrcodebykriss.fr</a> - Tous droits réservés.
            </p>
            <div class="mt-4 flex justify-center space-x-6">
                <a href="{% url 'about' %}" class="text-gray-500 hover:text-gray-800">À propos</a>
                <a href="{% url 'privacy' %}" class="text-gray-500 hover:text-gray-800">Confidentialité</a>
                <a href="https://github.com/christopheschulz" target="_blank" class="text-gray-500 hover:text-gray-800">GitHub</a>
                <a href="mailto:krisskoolbycode@etik.com" class="text-gray-500 hover:text-gray-800">Contact</a>
            </div>
        </div>
    </footer>

    <!-- Scripts globaux -->
    <script src="{% static 'script/navigation.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
